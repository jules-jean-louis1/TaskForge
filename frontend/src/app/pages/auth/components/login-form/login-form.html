<form (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label for="email">Email</label>
    <input
      type="email"
      id="email"
      class="form-control tf-input"
      name="email"
      [(ngModel)]="email"
      placeholder="nom@exemple.com"
      required
    />
  </div>

  <div class="form-group">
    <label for="password">Mot de passe</label>
    <input
      type="password"
      id="password"
      class="form-control tf-input"
      name="password"
      [(ngModel)]="password"
      placeholder="••••••••"
      required
    />
  </div>

  <button type="submit" class="btn-submit tf-button tf-button--primary">Se connecter</button>
</form>
