tls:
  certificates:
    - certFile: /etc/traefik/certs/local.crt
      keyFile: /etc/traefik/certs/local.key

http:
  middlewares:
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true

    compression:
      compress: {}

    api-ratelimit:
      rateLimit:
        average: 100
        burst: 50

    dashboard-auth:
      basicAuth:
        usersFile: /etc/traefik/htpasswd

  routers:
    traefik:
      rule: "Host(`traefik.localhost`)"
      entryPoints:
        - websecure
      service: api@internal
      tls: {}
      middlewares:
        - dashboard-auth
        - security-headers

    backend:
      rule: "Host(`api.localhost`)"
      entryPoints:
        - websecure
      service: backend
      tls: {}
      middlewares:
        - security-headers
        - compression
        - api-ratelimit

    frontend:
      rule: "Host(`app.localhost`)"
      entryPoints:
        - websecure
      service: frontend
      tls: {}
      middlewares:
        - security-headers
        - compression

  services:
    backend:
      loadBalancer:
        servers:
          - url: "http://backend:50051"

    frontend:
      loadBalancer:
        servers:
          - url: "http://frontend:4200"