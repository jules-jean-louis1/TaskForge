global:
  checkNewVersion: true
  sendAnonymousUsage: false

entryPoints:
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

  websecure:
    address: :443

api:
  dashboard: true
  insecure: false
  debug: false

ping: {}

providers:
  docker:
    exposedByDefault: false
    endpoint: unix:///var/run/docker.sock
    watch: true
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

log:
  level: INFO

accessLog:
  bufferingSize: 100
  filters:
    statusCodes: []